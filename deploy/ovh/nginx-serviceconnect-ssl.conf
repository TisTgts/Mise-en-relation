# Nginx — plateforme avec HTTPS (après certbot)
# Copier : sudo cp deploy/ovh/nginx-serviceconnect-ssl.conf /etc/nginx/sites-available/plateforme
# Variables : remplacer DOMAIN par votre domaine (ex. toghinis.net)

# --- HTTP domaine : défi Let's Encrypt + redirection HTTPS ---
server {
    listen 80;
    server_name toghinis.net www.toghinis.net;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/plateforme/certbot/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTP IP : accès direct sans certificat (optionnel) ---
server {
    listen 80;
    server_name 144.217.82.132;

    client_max_body_size 20M;

    location /media/ {
        alias /var/www/plateforme/backend/media/;
    }

    location ^~ /static/js/ {
        alias /var/www/plateforme/frontend/build/static/js/;
        access_log off;
        expires 30d;
    }
    location ^~ /static/css/ {
        alias /var/www/plateforme/frontend/build/static/css/;
        access_log off;
        expires 30d;
    }
    location ^~ /static/media/ {
        alias /var/www/plateforme/frontend/build/static/media/;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /var/www/plateforme/backend/staticfiles/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/plateforme/frontend/build;
        try_files $uri $uri/ /index.html;
    }
}

# --- HTTPS domaine ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name toghinis.net www.toghinis.net;

    ssl_certificate /etc/letsencrypt/live/toghinis.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toghinis.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /media/ {
        alias /var/www/plateforme/backend/media/;
    }

    location ^~ /static/js/ {
        alias /var/www/plateforme/frontend/build/static/js/;
        access_log off;
        expires 30d;
    }
    location ^~ /static/css/ {
        alias /var/www/plateforme/frontend/build/static/css/;
        access_log off;
        expires 30d;
    }
    location ^~ /static/media/ {
        alias /var/www/plateforme/frontend/build/static/media/;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /var/www/plateforme/backend/staticfiles/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /var/www/plateforme/frontend/build;
        try_files $uri $uri/ /index.html;
    }
}
