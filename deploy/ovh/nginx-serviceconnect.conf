# Site Nginx pour ServiceConnect sur VPS OVH
# À copier vers : /etc/nginx/sites-available/serviceconnect
# Puis : sudo ln -s /etc/nginx/sites-available/serviceconnect /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

# Remplacer VOTRE_DOMAINE.fr par votre domaine (ou commenter server_name et utiliser l'IP)

server {
    listen 80;
    server_name 144.217.82.132 VOTRE_DOMAINE.fr www.VOTRE_DOMAINE.fr;

    client_max_body_size 20M;

    # Fichiers uploadés (photos profil, pièces jointes…)
    location /media/ {
        alias /var/www/plateforme/backend/media/;
    }

    # Fichiers statiques Django (admin, collectstatic)
    location /static/ {
        alias /var/www/plateforme/backend/staticfiles/;
    }

    # API Django (Gunicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Admin Django (optionnel, même backend)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application React (build)
    location / {
        root /var/www/plateforme/frontend/build;
        try_files $uri $uri/ /index.html;
    }
}
