# Site Nginx — toghinis.com (/var/www/plateforme-com)
# Copier : sudo cp deploy/ovh/nginx-serviceconnect.conf /etc/nginx/sites-available/plateforme-com

server {
    listen 80;
    server_name toghinis.com www.toghinis.com;

    client_max_body_size 20M;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/plateforme-com/certbot/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    location /media/ {
        alias /var/www/plateforme-com/backend/media/;
    }

    location ^~ /static/js/ {
        alias /var/www/plateforme-com/frontend/build/static/js/;
        access_log off;
        expires 30d;
    }
    location ^~ /static/css/ {
        alias /var/www/plateforme-com/frontend/build/static/css/;
        access_log off;
        expires 30d;
    }
    location ^~ /static/media/ {
        alias /var/www/plateforme-com/frontend/build/static/media/;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /var/www/plateforme-com/backend/staticfiles/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/plateforme-com/frontend/build;
        try_files $uri $uri/ /index.html;
    }
}
