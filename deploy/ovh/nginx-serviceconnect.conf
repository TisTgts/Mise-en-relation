# Site Nginx — plateforme (/var/www/plateforme)
# Copier : /etc/nginx/sites-available/plateforme

server {
    listen 80;
    server_name 144.217.82.132 toghinis.net www.toghinis.net;

    client_max_body_size 20M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/plateforme/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /media/ {
        alias /var/www/plateforme/backend/media/;
    }

    # React (build CRA) — AVANT le /static/ Django (sinon page blanche)
    location ^~ /static/js/ {
        alias /var/www/plateforme/frontend/build/static/js/;
        access_log off;
        expires 30d;
    }
    location ^~ /static/css/ {
        alias /var/www/plateforme/frontend/build/static/css/;
        access_log off;
        expires 30d;
    }
    location ^~ /static/media/ {
        alias /var/www/plateforme/frontend/build/static/media/;
        access_log off;
        expires 30d;
    }

    # Django (admin, collectstatic) — ne capture pas /static/js/ ni /static/css/
    location /static/ {
        alias /var/www/plateforme/backend/staticfiles/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/plateforme/frontend/build;
        try_files $uri $uri/ /index.html;
    }
}
